# Builds the pip-installable llama-server engine wheels
# (skulk-llama-server-cuda, skulk-llama-server-vulkan; packaging/) and
# publishes them to the Foxlight PEP 503 index on Cloudflare R2, which is the
# sole wheel channel. Same principle as
# cuda-image.yml: the compilers run on plain amd64 or arm64 runners without a
# GPU, inside pinned containers, so each wheel's glibc/toolkit lineage is known.
# Building from the pinned upstream SOURCE (not upstream's binaries) is the
# supply-chain posture: we trust llama.cpp's code at a tag, built by us.
#
# Build runs on dispatch and on packaging changes; PUBLISH runs only on manual
# dispatch with publish=true (cutting a wheel release is a deliberate act).
# The PyPI mirror was retired 2026-08-30: versions already published there stay
# up (the index is append-only), but new versions go only to the R2 index.
#
# Advancing the engine pin is a checklist (architecture-reference.md
# "Engine pin advancement"); the guard step enforces the mechanical parts.
name: engine-wheel

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the wheels to the Foxlight R2 index"
        type: boolean
        default: false
      publish_variant:
        description: "Publish only the package family whose version was advanced"
        type: choice
        options: [all, cuda, vulkan]
        default: all
  push:
    branches: [dev]
    paths:
      - "packaging/**"
      - ".github/workflows/engine-wheel.yml"

env:
  # Must match src/skulk/provisioning/manifest.py LLAMA_SERVER_PIN and both
  # packaging versions (0.<build>.<rev>); the guard step enforces all of them.
  LLAMA_CPP_PIN: b10753
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Container jobs default to sh (dash), which rejects `set -o pipefail`;
    # every run step here assumes bash.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - variant: cuda
            runner: ubuntu-22.04
            container: nvidia/cuda:12.4.1-devel-ubuntu22.04
            cuda_architectures: "80-real;86-real;89-real;90"
            package: skulk-llama-server-cuda
            module: skulk_llama_server_cuda
            artifact: skulk-llama-server-cuda-amd64-wheel
          - variant: cuda
            # Grace Blackwell / GB10 is an arm64 host with compute capability
            # 12.1. CUDA 12.9 is the first toolkit lane we support for sm_121.
            runner: ubuntu-22.04-arm
            container: nvidia/cuda:12.9.1-devel-ubuntu22.04
            cuda_architectures: "121-real"
            package: skulk-llama-server-cuda
            module: skulk_llama_server_cuda
            artifact: skulk-llama-server-cuda-arm64-wheel
          - variant: vulkan
            runner: ubuntu-22.04
            container: ubuntu:22.04
            cuda_architectures: ""
            package: skulk-llama-server-vulkan
            module: skulk_llama_server_vulkan
            artifact: skulk-llama-server-vulkan-wheel
    container: ${{ matrix.container }}
    steps:
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq git cmake build-essential libcurl4-openssl-dev curl ca-certificates binutils gnupg
          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            # LunarG Vulkan SDK for glslc + headers, the same source upstream
            # llama.cpp CI uses for its Vulkan builds.
            curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc \
              | gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
            echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan jammy main" \
              > /etc/apt/sources.list.d/lunarg-vulkan.list
            apt-get update -qq
            apt-get install -y -qq vulkan-sdk
          fi

      - uses: actions/checkout@v4

      - name: Guard pin agreement
        run: |
          set -euo pipefail
          grep -q "LLAMA_SERVER_PIN: Final = \"$LLAMA_CPP_PIN\"" src/skulk/provisioning/manifest.py
          BUILD_NUM="${LLAMA_CPP_PIN#b}"
          grep -q "version = \"0.${BUILD_NUM}\." packaging/skulk-llama-server-cuda/pyproject.toml
          grep -q "version = \"0.${BUILD_NUM}\." packaging/skulk-llama-server-vulkan/pyproject.toml
          grep -q "ARG LLAMA_CPP_REF=$LLAMA_CPP_PIN" deployment/cuda/Dockerfile
          # The installer derives the wheel version from the checkout's
          # manifest; guard the derivation wiring rather than a literal.
          grep -q 'skulk-llama-server-cuda==0.${ENGINE_BUILD}' install.sh
          grep -q 'skulk-llama-server-vulkan==0.${ENGINE_BUILD}' install.sh
          grep -q 'LLAMA_SERVER_PIN' install.sh

      - name: Build llama-server (${{ matrix.variant }})
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LLAMA_CPP_PIN" \
            https://github.com/ggml-org/llama.cpp /tmp/llama-cpp-src
          if [ "${{ matrix.variant }}" = "cuda" ]; then
            # GGML_CUDA_NO_VMM: the VMM allocator references CUDA driver-API
            # symbols (cuMem*), and a GPU-less builder cannot satisfy the
            # transitive libcuda.so.1 NEEDED resolution at the executable
            # link (the toolkit stubs ship only libcuda.so, and LIBRARY_PATH
            # cannot influence transitive SONAME resolution at all, which is
            # why the stubs approach failed). Disabling VMM removes every
            # driver-API reference; llama-server commits its KV window up
            # front at a fixed -c, so the VMM pool allocator's benefit is
            # marginal for this serving shape.
            # CUDA wheels must not inherit the runner's CPU instruction set:
            # a native AMX build can SIGILL during model load on a GPU host.
            BACKEND_FLAGS="-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.cuda_architectures }} -DGGML_CUDA_NO_VMM=ON -DGGML_NATIVE=OFF"
          else
            BACKEND_FLAGS="-DGGML_VULKAN=ON"
          fi
          cmake -S /tmp/llama-cpp-src -B /tmp/build \
            $BACKEND_FLAGS \
            -DGGML_RPC=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build /tmp/build --target llama-server ggml-rpc-server -j"$(nproc)"

      - name: Assemble wheel payload
        run: |
          set -euo pipefail
          BIN=packaging/${{ matrix.package }}/src/${{ matrix.module }}/bin
          mkdir -p "$BIN"
          cp /tmp/build/bin/llama-server /tmp/build/bin/ggml-rpc-server "$BIN"/
          cp /tmp/build/bin/*.so* "$BIN"/ 2>/dev/null || true
          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            # Bundle the Khronos loader (Apache-2.0, redistributable) so the
            # wheel needs no system libvulkan; the driver's ICD remains the
            # one genuine OS prerequisite.
            cp /usr/lib/x86_64-linux-gnu/libvulkan.so.1* "$BIN"/
          fi
          strip --strip-unneeded "$BIN"/llama-server "$BIN"/ggml-rpc-server "$BIN"/*.so* || true
          ls -la "$BIN"/

      - name: Install uv
        run: |
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build wheel
        run: |
          set -euo pipefail
          cd packaging/${{ matrix.package }}
          uv build --wheel
          ls -la dist/

      - name: Smoke-test wheel (no GPU; exec + version only)
        run: |
          set -euo pipefail
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python \
            packaging/${{ matrix.package }}/dist/*.whl
          /tmp/smoke/bin/llama-server-${{ matrix.variant }} --version
          # --list-devices on a GPU-less runner legitimately reports no
          # devices; the point is that the shim resolves and the binary execs.
          /tmp/smoke/bin/llama-server-${{ matrix.variant }} --list-devices || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packaging/${{ matrix.package }}/dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packaging/${{ matrix.package }}/dist/*.whl
          if-no-files-found: error

  # The Foxlight R2 wheel index (wheels.foxlight.ai) is the SOURCE OF
  # TRUTH for both engine wheels: branded, size-unconstrained, ours (the
  # PyTorch/download.pytorch.org pattern; the CUDA wheel's ~450MB is over
  # PyPI's per-file limit). Wheels carry sigstore build provenance from the
  # build job (gh attestation verify <wheel> --owner Foxlight-Foundation).
  # Requires repository secrets R2_ACCOUNT_ID / R2_ACCESS_KEY_ID /
  # R2_SECRET_ACCESS_KEY / R2_BUCKET.
  publish-index:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-wheel"
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v6
      - name: Publish wheels to the Foxlight index
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLISH_VARIANT: ${{ inputs.publish_variant || 'all' }}
        run: |
          set -euo pipefail
          # Packaging-only CUDA revisions must not overwrite the existing Vulkan
          # version with newly rebuilt bytes. All architectures of the selected
          # package still publish together from this attested workflow run.
          case "$PUBLISH_VARIANT" in
            all) WHEEL_PREFIX=skulk_llama_server_ ;;
            cuda) WHEEL_PREFIX=skulk_llama_server_cuda- ;;
            vulkan) WHEEL_PREFIX=skulk_llama_server_vulkan- ;;
            *) echo "unsupported publication variant" >&2; exit 1 ;;
          esac
          uv run --no-project --with boto3 python scripts/publish_wheel_index.py dist/"$WHEEL_PREFIX"*.whl
