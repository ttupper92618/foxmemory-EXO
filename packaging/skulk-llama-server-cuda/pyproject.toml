# The pip-installable CUDA llama-server engine (#614 engine provisioning).
#
# This wheel carries ONLY the Foxlight-built llama-server binary (plus
# ggml-rpc-server and the ggml shared libraries) compiled from the pinned
# upstream llama.cpp release with CUDA enabled. The CUDA runtime comes from
# NVIDIA's own official PyPI packages, declared as ordinary dependencies, so
# nothing here duplicates or rehosts NVIDIA libraries and the wheel stays
# small. The `llama-server-cuda` entry point resolves those packages' library
# directories at run time and execs the real binary with them on the loader
# path.
#
# Version scheme: 0.<llama.cpp build>.<packaging revision>, so 0.10068.0 is
# the first packaging of upstream b10068. Advancing the engine pin bumps the
# minor; packaging-only fixes bump the patch.
#
# Built and published by .github/workflows/engine-wheel.yml to Foxlight's
# package index. The binary is compiled in that workflow, not committed here.

[project]
name = "skulk-llama-server-cuda"
version = "0.10753.1"
description = "Pinned CUDA llama-server build for Skulk's served GGUF engine (Linux x86_64 and aarch64)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  # NVIDIA's official CUDA runtime wheels; the shim puts their lib dirs on
  # LD_LIBRARY_PATH before exec'ing llama-server.
  "nvidia-cuda-runtime-cu12>=12.4; platform_machine == 'x86_64'",
  "nvidia-cublas-cu12>=12.4; platform_machine == 'x86_64'",
  # The aarch64 wheel targets Grace Blackwell sm_121 and is compiled with
  # CUDA 12.9, so its user-space runtime must be at least that new.
  "nvidia-cuda-runtime-cu12>=12.9; platform_machine == 'aarch64'",
  "nvidia-cublas-cu12>=12.9; platform_machine == 'aarch64'",
  # The pinned CUDA binary links NCCL even for single-device startup. Minimal
  # hosts must not depend on NCCL happening to exist in the build container.
  "nvidia-nccl-cu12>=2.31.2,<3",
]

[project.scripts]
llama-server-cuda = "skulk_llama_server_cuda:main"
ggml-rpc-server-cuda = "skulk_llama_server_cuda:rpc_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skulk_llama_server_cuda"]
# The compiled binaries land here during the CI build (see engine-wheel.yml);
# artifact-info.json records the upstream tag and source checksum.
artifacts = ["src/skulk_llama_server_cuda/bin/**", "src/skulk_llama_server_cuda/licenses/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
# Marks the wheel platform-specific (Linux x86_64 or aarch64) even though the
# Python shim itself is pure: the payload under bin/ is compiled.
path = "hatch_build.py"
